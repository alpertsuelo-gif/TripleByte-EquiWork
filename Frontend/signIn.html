<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EquiWork | Sign In</title>

<style>
:root {
    --primary: #352fd1;
    --primary-dark: #17144d;
    --text-main: #0f172a;
    --text-muted: #475569;
    --glass-bg: rgba(255, 255, 255, 0.45);
    --glass-border: rgba(255, 255, 255, 0.75);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--text-main);
}

/* BACKGROUND */
.background-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: -1;
}

/* LOGIN CARD */
.login-card {
    position: fixed;
    top: 50%;
    right: 5vw;
    transform: translateY(-50%);

    width: 440px;
    padding: 44px 48px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: var(--glass-bg);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);

    border: 1px solid var(--glass-border);
    border-radius: 24px;

    box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.14),
        0 4px 16px rgba(15, 23, 42, 0.06),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);

    overflow: hidden;
    animation: cardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardFadeIn {
    from {
        opacity: 0;
        transform: translateY(calc(-50% + 16px));
    }
    to {
        opacity: 1;
        transform: translateY(-50%);
    }
}

/* GLASS SPECULAR REFLECTION */
.login-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(255, 255, 255, 0.08) 40%,
        transparent 55%
    );
    pointer-events: none;
}

.login-card > * {
    position: relative;
    z-index: 1;
    width: 100%;
}

/* HEADER & LOGO */
.card-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 24px;
}

.logo {
    width: 140px;
    height: auto;
    max-height: 85px;
    object-fit: contain;
    margin-bottom: 16px;
}

.login-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-main);
    margin-bottom: 4px;
}

.login-subtitle {
    font-size: 14px;
    color: var(--text-muted);
}

/* FORM */
.login-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.input-group {
    position: relative;
    width: 100%;
}

.login-input {
    width: 100%;
    height: 46px;
    padding: 0 18px;

    border: 1.5px solid rgba(148, 163, 184, 0.45);
    border-radius: 14px;

    background: rgba(255, 255, 255, 0.55);
    outline: none;
    font-size: 14px;
    color: var(--text-main);
    transition: all 0.2s ease;
}

.login-input.has-icon {
    padding-right: 44px;
}

.login-input::placeholder {
    color: rgba(71, 85, 105, 0.75);
}

.login-input:hover {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(100, 116, 139, 0.6);
}

.login-input:focus {
    border-color: var(--primary);
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 0 0 4px rgba(53, 47, 209, 0.14);
}

/* PASSWORD TOGGLE */
.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 4px;
    transition: color 0.2s;
}

.toggle-password:hover {
    color: var(--text-main);
}

/* FORGOT PASSWORD */
.form-options {
    display: flex;
    justify-content: flex-end;
    margin-top: -4px;
}

.forgot-link {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--primary);
    text-decoration: none;
}

.forgot-link:hover {
    text-decoration: underline;
}

/* PRIMARY BUTTON */
.login-button {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 14px;

    background: linear-gradient(115deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;

    cursor: pointer;
    box-shadow: 0 8px 20px rgba(53, 47, 209, 0.28);
    transition: all 0.2s ease;
}

.login-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 24px rgba(53, 47, 209, 0.36);
    filter: brightness(1.06);
}

.login-button:active {
    transform: translateY(0);
}

/* DIVIDER */
.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 6px 0;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(148, 163, 184, 0.45);
}

/* SECONDARY GOOGLE BUTTON */
.google-button {
    width: 100%;
    height: 46px;
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    border-radius: 14px;

    background: rgba(255, 255, 255, 0.78);
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    cursor: pointer;
    transition: all 0.2s ease;
}

.google-button:hover {
    background: rgba(255, 255, 255, 0.96);
    border-color: rgba(100, 116, 139, 0.65);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
}

/* REGISTER LINK */
.register-link {
    text-align: center;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-muted);
}

.register-link a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}

.register-link a:hover {
    text-decoration: underline;
}

/* RESPONSIVE */
@media (max-width: 700px) {
    body {
        overflow-y: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
    }

    .login-card {
        position: relative;
        top: auto;
        right: auto;
        transform: none;
        width: 100%;
        max-width: 420px;
        padding: 36px 24px;
        animation: none;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND HTML -->
<iframe
    src="BackgroundTemplate/background_template.html"
    class="background-frame"
    title="EquiWork Background">
</iframe>

<!-- LOGIN CARD -->
<main class="login-card">

    <div class="card-header">
        <img
            src="assets/EquiWork-Logo.png"
            alt="EquiWork Logo"
            class="logo"
        >
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to your EquiWork workspace</p>
    </div>

    <form class="login-form" id="loginForm">

        <div class="input-group">
            <input
                type="email"
                class="login-input"
                placeholder="Email address"
                autocomplete="email"
                required
            >
        </div>

        <div class="input-group">
            <input
                type="password"
                id="passwordInput"
                class="login-input has-icon"
                placeholder="Password"
                autocomplete="current-password"
                required
            >
            <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
            >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <div class="form-options">
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-button">
            SIGN IN
        </button>

        <div class="divider">or continue with</div>

        <button
            type="button"
            class="google-button"
            id="googleLogin"
        >
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
            </svg>
            Google
        </button>

        <div class="register-link">
            Don't have an account? <a href="RegisterAccount.html">Create one</a>
        </div>

    </form>

</main>

<script>
// Password visibility toggle
const toggleBtn = document.getElementById("togglePassword");
const passwordInput = document.getElementById("passwordInput");

toggleBtn.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
});

// Form handler — now actually calls the backend
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.querySelector('input[type="email"]').value;
    const password = passwordInput.value;

    try {
        const response = await fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const message = await response.text();

        if (response.ok) {
            alert("Login successful!");
            // TODO: redirect to dashboard page here, e.g.:
            // window.location.href = "dashboard.html";
        } else {
            alert("Login failed: " + message);
        }
    } catch (err) {
        alert("Could not reach the server. Is it running?");
        console.error(err);
    }
});

document.getElementById("googleLogin").addEventListener("click", function() {
    console.log("Google authentication requested");
});
</script>

</body>
</html>

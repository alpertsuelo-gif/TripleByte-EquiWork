<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EquiWork | Register an Employer</title>

<style>
:root {
    --primary: #261fc4;
    --primary-dark: #15117a;
    --heading-color: #1f2247;
    --text-main: #222638;
    --text-muted: #4b5068;
    --error-red: #b91c1c;
    --glass-bg: rgba(255, 255, 255, 0.86);
    --glass-border: rgba(255, 255, 255, 0.92);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--text-main);
    overflow-x: hidden;
}

/* BACKGROUND */
.background-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: -1;
}

/* WRAPPER FOR EXTERNAL TOP-RIGHT LINK + CARD */
.card-wrapper {
    position: relative;
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    animation: cardFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardFadeIn {
    from {
        opacity: 0;
        transform: translateY(14px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* EXTERNAL TOP-RIGHT LINK */
.switch-role-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
    padding-right: 4px;
}

.switch-role-link {
    font-size: 15px;
    font-weight: 500;
    color: #e4a928;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.switch-role-link:hover {
    opacity: 0.88;
    transform: translateY(-1px);
}

/* CENTERED REGISTER CARD */
.register-card {
    position: relative;
    width: 100%;
    padding: 38px 54px 40px;

    display: flex;
    flex-direction: column;

    background: var(--glass-bg);
    backdrop-filter: blur(36px) saturate(160%);
    -webkit-backdrop-filter: blur(36px) saturate(160%);

    border: 1px solid var(--glass-border);
    border-radius: 16px;

    box-shadow:
        0 24px 60px rgba(15, 20, 55, 0.22),
        0 4px 16px rgba(15, 20, 55, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
}

/* HEADER WITH TITLE LEFT & LOGO RIGHT */
.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
}

.card-title {
    font-size: 31px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--heading-color);
}

/* PLACEHOLDER LOGO */
.logo-placeholder {
    width: 115px;
    height: 62px;
    object-fit: contain;
    flex-shrink: 0;
}

/* FORM & INPUTS */
.register-form {
    width: 100%;
    display: flex;
    flex-direction: column;
}

.input-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.input-group {
    position: relative;
    width: 100%;
}

.form-input {
    width: 100%;
    height: 44px;
    padding: 0 18px;
    border: 1.5px solid #b4b8c5;
    border-radius: 10px;
    background: rgba(241, 243, 248, 0.85);
    font-size: 15px;
    color: var(--text-main);
    outline: none;
    transition: all 0.2s ease;
}

.form-input::placeholder {
    color: #b4b7c2;
}

.form-input:hover {
    background: rgba(255, 255, 255, 0.95);
    border-color: #8f95a8;
}

.form-input:focus {
    background: #ffffff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(38, 31, 196, 0.14);
}

.form-input.input-error {
    border-color: var(--error-red);
}

.form-input.has-icon {
    padding-right: 44px;
}

/* PASSWORD TOGGLE */
.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #6b7280;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 4px;
}

.toggle-password:hover {
    color: var(--text-main);
}

/* INLINE PASSWORD ERROR (HIDDEN UNTIL TRIGGERED) */
.validation-hint {
    font-size: 12px;
    font-style: italic;
    font-weight: 500;
    color: var(--error-red);
    margin-top: 5px;
    margin-bottom: 14px;
    padding-left: 4px;
    min-height: 16px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}

.validation-hint.visible {
    opacity: 1;
    visibility: visible;
}

/* CHECKBOXES */
.consent-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 26px;
}

.checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    user-select: none;
}

.checkbox-wrapper {
    position: relative;
    flex-shrink: 0;
    width: 21px;
    height: 21px;
    margin-top: 2px;
}

.checkbox-wrapper input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    margin: 0;
    z-index: 2;
}

.checkbox-box {
    width: 21px;
    height: 21px;
    border: 2px solid #8a8f9e;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
}

.checkbox-box svg {
    width: 14px;
    height: 14px;
    stroke: #111827;
    stroke-width: 3;
    fill: none;
    opacity: 0;
    transform: scale(0.75);
    transition: all 0.16s ease;
}

.checkbox-wrapper input:hover + .checkbox-box {
    border-color: var(--primary);
}

.checkbox-wrapper input:focus-visible + .checkbox-box {
    box-shadow: 0 0 0 3px rgba(38, 31, 196, 0.22);
    border-color: var(--primary);
}

.checkbox-wrapper input:checked + .checkbox-box {
    border-color: #4b5563;
    background: #ffffff;
}

.checkbox-wrapper input:checked + .checkbox-box svg {
    opacity: 1;
    transform: scale(1);
}

.consent-text {
    font-size: 13px;
    line-height: 1.44;
    color: var(--text-main);
}

.consent-text a {
    color: var(--primary);
    font-weight: 500;
    text-decoration: none;
}

.consent-text a:hover {
    text-decoration: underline;
}

/* ACTION BUTTONS */
.button-group {
    width: 100%;
    max-width: 490px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.btn {
    width: 100%;
    height: 42px;
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.2s ease;
}

.btn-primary {
    border: none;
    background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(38, 31, 196, 0.26);
}

.btn-primary:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(38, 31, 196, 0.34);
}

.btn-primary:active {
    transform: translateY(0);
}

.btn-secondary {
    background: #ffffff;
    color: #111827;
    border: 1px solid rgba(148, 163, 184, 0.35);
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
}

.btn-secondary:hover {
    background: #f8fafc;
    border-color: rgba(100, 116, 139, 0.5);
    transform: translateY(-1px);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .register-card {
        padding: 30px 24px 32px;
    }

    .card-header {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 12px;
    }

    .card-title {
        font-size: 25px;
    }

    .logo-placeholder {
        width: 95px;
        height: 50px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND HTML -->
<iframe
    src="BackgroundTemplate/background_template.html"
    class="background-frame"
    title="EquiWork Background">
</iframe>

<!-- WRAPPER -->
<div class="card-wrapper">

    <!-- TOP-RIGHT ROLE SWITCH LINK -->
    <div class="switch-role-bar">
        <a href="registerEmployee.html" class="switch-role-link">
            Register as an employee?
        </a>
    </div>

    <!-- EMPLOYER REGISTER CARD -->
    <main class="register-card">

        <header class="card-header">
            <h1 class="card-title">Register as an employer</h1>
            <!-- Placeholder image for EquiWork logo -->
            <img
                src="assets/EquiWork-Logo.png"
                alt="EquiWork Logo"
                class="logo-placeholder"
            >
        </header>

        <form class="register-form" id="employerRegisterForm" novalidate>

            <div class="input-stack">
                <div class="input-group">
                    <input
                        type="email"
                        id="emailInput"
                        class="form-input"
                        placeholder="Email Address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <input
                        type="password"
                        id="passwordInput"
                        class="form-input has-icon"
                        placeholder="Password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="validation-hint" id="passwordHint" role="alert">
                Please try again: 8 Characters or more.
            </div>

            <div class="consent-list">
                <!-- Required Privacy / Collection Notice Checkbox -->
                <label class="checkbox-row" for="termsCheckbox">
                    <span class="checkbox-wrapper">
                        <input type="checkbox" id="termsCheckbox" checked required>
                        <span class="checkbox-box">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </span>
                    </span>
                    <span class="consent-text">
                        By registering, I agree to the <a href="collection-notice.html">Collection Notice</a> and <a href="privacy.html">Privacy Policy</a> of EquiWork. I agree to receive messages about job opportunities, job postings, and platform updates that support my job search. I can unsubscribe at any time.
                    </span>
                </label>

                <!-- Optional Updates Checkbox -->
                <label class="checkbox-row" for="marketingCheckbox">
                    <span class="checkbox-wrapper">
                        <input type="checkbox" id="marketingCheckbox" checked>
                        <span class="checkbox-box">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </span>
                    </span>
                    <span class="consent-text">
                        In addition to receiving messages that support my job search, I agree to receive career advice, newsletters, surveys, and other updates from EquiWork. I can unsubscribe at any time.
                    </span>
                </label>
            </div>

            <div class="button-group">
                <a href="Employer_Page\employer.html" class="btn btn-primary">
                    Register new account
                </a>
                <a href="signIn.html" class="btn btn-secondary">
                    Back to Sign In
                </a>
            </div>

        </form>

    </main>

</div>

<script>
const form = document.getElementById("employerRegisterForm");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const passwordHint = document.getElementById("passwordHint");
const termsCheckbox = document.getElementById("termsCheckbox");
const marketingCheckbox = document.getElementById("marketingCheckbox");
const toggleBtn = document.getElementById("togglePassword");

let hasAttemptedSubmit = false;

// Password visibility toggle
toggleBtn.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
});

// Clear or update error state once user has tried submitting
passwordInput.addEventListener("input", () => {
    if (passwordInput.value.length >= 8) {
        passwordInput.classList.remove("input-error");
        passwordHint.classList.remove("visible");
    } else if (hasAttemptedSubmit) {
        passwordInput.classList.add("input-error");
        passwordHint.classList.add("visible");
    }
});

// Submit validation
form.addEventListener("submit", function(e) {
    e.preventDefault();
    hasAttemptedSubmit = true;

    if (!emailInput.value.trim() || !emailInput.checkValidity()) {
        emailInput.classList.add("input-error");
        emailInput.focus();
        return;
    }
    emailInput.classList.remove("input-error");

    if (passwordInput.value.length < 8) {
        passwordInput.classList.add("input-error");
        passwordHint.classList.add("visible");
        passwordInput.focus();
        return;
    }

    if (!termsCheckbox.checked) {
        alert("Please agree to the Collection Notice and Privacy Policy to register.");
        return;
    }

    console.log("Employer registration submitted", {
        email: emailInput.value.trim(),
        marketingOptIn: marketingCheckbox.checked
    });
});
</script>

</body>
</html>

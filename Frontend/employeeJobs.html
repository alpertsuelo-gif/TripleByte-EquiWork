<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EquiWork | Find Odd Jobs & Local Work</title>

<style>
:root {
    --primary: #261fc4;
    --primary-dark: #15117a;
    --primary-glow: rgba(38, 31, 196, 0.25);
    --success: #059669;
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
    --warning: #d97706;
    --heading-color: #1f2247;
    --text-main: #222638;
    --text-muted: #5a6078;
    --glass-bg: rgba(255, 255, 255, 0.78);
    --glass-card: rgba(255, 255, 255, 0.88);
    --glass-border: rgba(255, 255, 255, 0.92);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--text-main);
    overflow-x: hidden;
}

/* SHARED BACKGROUND IFRAME */
.background-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: -1;
}

/* MAIN APP CONTAINER */
.app-shell {
    max-width: 1360px;
    margin: 22px auto;
    padding: 0 20px 40px;
}

/* TOP NAVBAR + SEARCH BAR SHELL */
.top-glass-header {
    position: relative;
    z-index: 40;
    background: var(--glass-bg);
    backdrop-filter: blur(32px) saturate(160%);
    -webkit-backdrop-filter: blur(32px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    box-shadow: 0 18px 45px rgba(15, 20, 55, 0.14);
    margin-bottom: 24px;
}

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 18px 18px 0 0;
}

.brand-area {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
}

/* LOGO */
.brand-logo {
    height: 50px;
    width: auto;
    object-fit: contain;
    transition: transform 0.2s ease;
}

.brand-area:hover .brand-logo {
    transform: scale(1.03);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 26px;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    text-decoration: none;
    padding: 8px 4px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: all 0.2s ease;
}

.nav-link.active,
.nav-link:hover {
    color: var(--primary);
    font-weight: 600;
}

.nav-link.active {
    border-bottom-color: var(--primary);
}

.nav-badge {
    background: rgba(38, 31, 196, 0.12);
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
}

.nav-actions {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
}

.lang-pill {
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.28);
    font-size: 12.5px;
    color: var(--heading-color);
}

.action-anchor {
    position: relative;
}

.icon-btn {
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(148, 163, 184, 0.35);
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--heading-color);
    cursor: pointer;
    transition: all 0.2s ease;
}

.icon-btn:hover,
.icon-btn.active {
    background: #ffffff;
    border-color: var(--primary);
    color: var(--primary);
    box-shadow: 0 6px 16px rgba(38, 31, 196, 0.14);
}

/* =========================================================
   NOTIFICATIONS SIDE-DROP POPOVER
   ========================================================= */
@keyframes popoverDrop {
    from {
        opacity: 0;
        transform: translateY(-8px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.nav-popover {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(36px) saturate(180%);
    -webkit-backdrop-filter: blur(36px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.98);
    border-radius: 16px;
    box-shadow:
        0 22px 50px rgba(15, 20, 55, 0.22),
        0 4px 14px rgba(15, 20, 55, 0.08);
    z-index: 999;
    display: none;
    overflow: hidden;
    animation: popoverDrop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav-popover.open {
    display: block;
}

.notif-popover {
    width: 310px;
}

.popover-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    background: rgba(255, 255, 255, 0.5);
}

.popover-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--heading-color);
}

.popover-sub-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.18);
    color: var(--text-muted);
}

.notif-empty-body {
    padding: 32px 22px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.notif-empty-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(38, 31, 196, 0.08);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
}

.notif-empty-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--heading-color);
}

.notif-empty-desc {
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--text-muted);
}

/* IMAGE ICON LINKS FOR PLACEHOLDER PAGES */
.icon-link {
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(148, 163, 184, 0.35);
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.2s ease;
}

.icon-link:hover {
    background: #ffffff;
    border-color: var(--primary);
    box-shadow: 0 6px 16px rgba(38, 31, 196, 0.14);
    transform: translateY(-1px);
}

.icon-link.danger:hover {
    border-color: var(--danger);
    background: #fef2f2;
    box-shadow: 0 6px 16px rgba(220, 38, 38, 0.14);
}

.nav-icon-img {
    width: 18px;
    height: 18px;
    object-fit: contain;
    display: block;
}

/* MULTI-FIELD SEARCH BAR */
.search-bar-row {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr 1fr 144px;
    align-items: stretch;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 0 0 18px 18px;
    overflow: hidden;
}

.search-cell {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-right: 1px solid rgba(148, 163, 184, 0.25);
}

.search-cell svg,
.peso-prefix {
    color: var(--primary);
    flex-shrink: 0;
    font-weight: 700;
    font-size: 15px;
}

.search-cell input,
.search-cell select {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
}

.search-cell input::placeholder {
    color: #7c8299;
}

.search-submit-btn {
    border: none;
    background: linear-gradient(105deg, var(--primary), var(--primary-dark));
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s ease;
}

.search-submit-btn:hover {
    filter: brightness(1.1);
}

/* WORKSPACE BODY: SIDEBAR + RESULTS */
.workspace-grid {
    display: grid;
    grid-template-columns: 275px 1fr;
    gap: 24px;
    align-items: start;
}

/* LEFT SIDEBAR: JOB SEARCH SETTINGS */
.filter-sidebar {
    background: var(--glass-bg);
    backdrop-filter: blur(32px) saturate(160%);
    -webkit-backdrop-filter: blur(32px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 24px 22px;
    box-shadow: 0 18px 45px rgba(15, 20, 55, 0.12);
}

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    color: var(--text-muted);
    text-decoration: none;
    margin-bottom: 14px;
}

.back-link:hover {
    color: var(--primary);
}

.sidebar-heading {
    font-size: 20px;
    font-weight: 700;
    color: var(--heading-color);
    margin-bottom: 20px;
}

.filter-group {
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.22);
}

.filter-group:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

.filter-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--heading-color);
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
}

.filter-chevron {
    transition: transform 0.2s ease;
    font-size: 12px;
}

.filter-group.collapsed .filter-chevron {
    transform: rotate(180deg);
}

.filter-group.collapsed .filter-body {
    display: none;
}

.filter-input {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border-radius: 9px;
    border: 1px solid rgba(148, 163, 184, 0.45);
    background: rgba(255, 255, 255, 0.78);
    font-size: 13px;
    color: var(--text-main);
    outline: none;
    transition: all 0.2s ease;
}

.filter-input:focus {
    background: #ffffff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(38, 31, 196, 0.12);
}

.checkbox-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.filter-check {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-main);
    cursor: pointer;
    user-select: none;
}

.filter-check input {
    accent-color: var(--primary);
    width: 16px;
    height: 16px;
    cursor: pointer;
}

/* RIGHT AREA: TOOLBAR + QUICK CHIPS + JOB CARDS */
.results-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
    padding: 0 4px;
}

.results-count {
    font-size: 14.5px;
    font-weight: 600;
    color: #ffffff;
    text-shadow: 0 1px 6px rgba(15, 20, 55, 0.45);
}

.view-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.pill-control {
    background: var(--glass-card);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    padding: 7px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    color: var(--heading-color);
    cursor: pointer;
    outline: none;
    transition: all 0.18s ease;
}

.pill-control:hover {
    background: #ffffff;
    border-color: var(--primary);
}

/* QUICK FILTER CHIPS */
.quick-chips-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    padding: 0 4px;
}

.quick-chip {
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(16px);
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--heading-color);
    cursor: pointer;
    transition: all 0.18s ease;
}

.quick-chip:hover {
    background: #ffffff;
    transform: translateY(-1px);
}

.quick-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
    box-shadow: 0 4px 12px var(--primary-glow);
}

/* 3-COLUMN BOARD GRID & LIST VIEW */
.jobs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding-top: 8px;
}

.jobs-grid.list-view {
    grid-template-columns: 1fr;
    gap: 14px;
}

.jobs-grid.list-view .job-card {
    flex-direction: row;
    align-items: center;
    gap: 20px;
    padding: 18px 24px;
}

.jobs-grid.list-view .card-main-info {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 16px;
}

.jobs-grid.list-view .card-top-row {
    margin-bottom: 0;
}

.jobs-grid.list-view .job-card-company,
.jobs-grid.list-view .schedule-tag {
    margin-bottom: 0;
}

.jobs-grid.list-view .card-bottom-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.jobs-grid.list-view .job-meta-row {
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
}

.jobs-grid.list-view .card-actions-row {
    width: 250px;
}

@keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

.job-card {
    position: relative;
    background: var(--glass-card);
    backdrop-filter: blur(32px) saturate(165%);
    -webkit-backdrop-filter: blur(32px) saturate(165%);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 14px 35px rgba(15, 20, 55, 0.12);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    animation: cardFadeUp 0.28s ease both;
}

.job-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 22px 45px rgba(15, 20, 55, 0.2);
}

/* FEATURED INDIGO "TOP PICK" CARD */
.job-card.featured {
    background: linear-gradient(145deg, #2d26d6, #18138c);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #ffffff;
    box-shadow: 0 22px 50px rgba(24, 19, 140, 0.38);
}

.top-pick-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: var(--heading-color);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border-radius: 6px;
    box-shadow: 0 4px 12px rgba(15, 20, 55, 0.18);
    white-space: nowrap;
}

.card-top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
}

.company-avatar {
    width: 46px;
    height: 46px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    color: #ffffff;
    flex-shrink: 0;
}

.badge-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
}

.role-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
}

.badge-amber { background: #fef3c7; color: #b45309; }
.badge-green { background: #dcfce7; color: #15803d; }
.badge-blue  { background: #e0f2fe; color: #0369a1; }
.badge-pink  { background: #fce7f3; color: #be185d; }
.badge-glass { background: rgba(255, 255, 255, 0.18); color: #ffffff; }

.status-chip {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
}

.status-not-started {
    background: #e0e7ff;
    color: #1e40af;
}

.status-in-progress {
    background: #d1fae5;
    color: #065f46;
}

.job-card.featured .status-not-started {
    background: rgba(255, 255, 255, 0.22);
    color: #ffffff;
}

.job-card-title {
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.32;
    margin-bottom: 4px;
}

.job-card-company {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
}

.job-card.featured .job-card-company {
    color: rgba(255, 255, 255, 0.8);
}

.schedule-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--heading-color);
    background: rgba(38, 31, 196, 0.08);
    padding: 4px 9px;
    border-radius: 6px;
    margin-bottom: 12px;
}

.job-card.featured .schedule-tag {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
}

.job-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.25);
}

.job-card.featured .job-meta-row {
    color: rgba(255, 255, 255, 0.9);
    border-bottom-color: rgba(255, 255, 255, 0.18);
}

.job-meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

.peso-rate {
    color: var(--primary);
    font-weight: 700;
}

.job-card.featured .peso-rate {
    color: #fde68a;
}

.card-actions-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr;
    gap: 8px;
}

.bookmark-btn {
    height: 34px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.4);
    background: rgba(255, 255, 255, 0.85);
    color: var(--heading-color);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s ease;
}

.bookmark-btn.saved {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
}

.job-card.featured .bookmark-btn {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.28);
    color: #ffffff;
}

.job-card.featured .bookmark-btn.saved {
    background: #ffffff;
    color: var(--primary);
}

.card-mini-btn {
    height: 34px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.4);
    background: rgba(255, 255, 255, 0.85);
    color: var(--heading-color);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
}

.card-mini-btn:hover {
    background: #ffffff;
    border-color: var(--primary);
    color: var(--primary);
}

.card-mini-btn.primary {
    background: linear-gradient(95deg, var(--primary), var(--primary-dark));
    border: none;
    color: #ffffff;
}

.card-mini-btn.applied {
    background: var(--success);
    border: none;
    color: #ffffff;
}

.card-mini-btn.cancel-btn {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--danger);
}

.card-mini-btn.cancel-btn:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
}

.job-card.featured .card-mini-btn {
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.25);
    color: #ffffff;
}

.job-card.featured .card-mini-btn.primary {
    background: #ffffff;
    color: var(--primary-dark);
}

.job-card.featured .card-mini-btn.applied {
    background: #10b981;
    color: #ffffff;
}

/* SKELETON LOADING CARDS */
.skeleton-card {
    height: 235px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.75);
    animation: pulseGlass 1.4s infinite ease-in-out;
}

@keyframes pulseGlass {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.9; }
}

/* =========================================================
   GLASSMORPHIC FLOATING SLIDE-OVER JOB DRAWER
   ========================================================= */
.drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 45, 0.22);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: all 0.28s ease;
}

.drawer-backdrop.open {
    opacity: 1;
    visibility: visible;
}

.job-drawer {
    position: fixed;
    top: 18px;
    right: 18px;
    bottom: 18px;
    width: calc(100% - 36px);
    max-width: 500px;

    background: rgba(255, 255, 255, 0.52);
    backdrop-filter: blur(42px) saturate(185%);
    -webkit-backdrop-filter: blur(42px) saturate(185%);

    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 22px;

    box-shadow:
        0 24px 60px rgba(15, 20, 55, 0.24),
        0 4px 16px rgba(15, 20, 55, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);

    z-index: 101;
    transform: translateX(calc(100% + 36px));
    transition: transform 0.36s cubic-bezier(0.16, 1, 0.3, 1);

    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.job-drawer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.32) 0%,
        rgba(255, 255, 255, 0.06) 45%,
        transparent 60%
    );
    pointer-events: none;
    z-index: 0;
}

.job-drawer.open {
    transform: translateX(0);
}

.drawer-banner {
    position: relative;
    height: 112px;
    width: 100%;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.45);
    z-index: 1;
}

.drawer-close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.78);
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #14172b;
    font-size: 19px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.drawer-close-btn:hover {
    background: rgba(255, 255, 255, 0.85);
    transform: rotate(90deg);
}

.drawer-avatar-row {
    position: relative;
    z-index: 2;
    padding: 0 28px;
    margin-top: -36px;
    margin-bottom: 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
}

.drawer-circle-badge {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.94);
    border: 2px solid #ffffff;
    box-shadow: 0 8px 22px rgba(15, 20, 55, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--heading-color);
    letter-spacing: 0.02em;
}

.drawer-view-all {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary);
    background: rgba(255, 255, 255, 0.68);
    border: 1px solid rgba(255, 255, 255, 0.85);
    padding: 6px 12px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.18s ease;
}

.drawer-view-all:hover {
    background: #ffffff;
}

.drawer-scroll-body {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 0 28px 24px;
}

.drawer-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #14172b;
    line-height: 1.26;
    margin-bottom: 4px;
}

.drawer-company-sub {
    font-size: 14px;
    font-weight: 500;
    color: #383e56;
    margin-bottom: 18px;
}

.drawer-kv-grid {
    display: grid;
    grid-template-columns: 112px 1fr;
    row-gap: 10px;
    column-gap: 12px;
    font-size: 13.5px;
    margin-bottom: 20px;
}

.kv-label {
    color: #4b516b;
    font-weight: 500;
}

.kv-value {
    color: #14172b;
    font-weight: 600;
}

.drawer-glass-box {
    background: rgba(255, 255, 255, 0.56);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.75);
    margin-bottom: 14px;
}

.drawer-description {
    font-size: 13.5px;
    line-height: 1.55;
    color: #1e2235;
    margin-bottom: 14px;
}

.drawer-highlights-title {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--heading-color);
    margin-bottom: 8px;
}

.drawer-highlights {
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    line-height: 1.48;
    color: #24293e;
}

/* INLINE COMPOSERS (APPLY & CANCEL) IN DRAWER */
.inline-composer {
    display: none;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(38, 31, 196, 0.25);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 12px;
}

.inline-composer.danger-box {
    border-color: rgba(220, 38, 38, 0.35);
    background: rgba(254, 242, 242, 0.86);
}

.inline-composer.open {
    display: block;
}

.inline-composer textarea,
.inline-composer select {
    width: 100%;
    border-radius: 9px;
    border: 1px solid rgba(148, 163, 184, 0.45);
    background: rgba(255, 255, 255, 0.94);
    padding: 9px 12px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    margin: 8px 0 10px;
}

.inline-composer textarea {
    height: 72px;
    resize: none;
}

.inline-composer textarea:focus,
.inline-composer select:focus {
    border-color: var(--primary);
}

.drawer-footer {
    position: relative;
    z-index: 2;
    padding: 14px 24px;
    background: rgba(255, 255, 255, 0.46);
    border-top: 1px solid rgba(255, 255, 255, 0.72);
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 12px;
}

.drawer-pill-btn {
    height: 42px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.drawer-pill-secondary {
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.95);
    color: #14172b;
    box-shadow: 0 4px 12px rgba(15, 20, 55, 0.06);
}

.drawer-pill-secondary:hover {
    background: #ffffff;
    transform: translateY(-1px);
}

.drawer-pill-primary {
    border: none;
    background: linear-gradient(95deg, var(--primary), var(--primary-dark));
    color: #ffffff;
    box-shadow: 0 6px 18px var(--primary-glow);
}

.drawer-pill-primary:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
}

.drawer-pill-primary.applied {
    background: var(--success);
    box-shadow: 0 6px 18px rgba(5, 150, 105, 0.28);
}

.drawer-pill-danger {
    border: 1px solid #fecaca;
    background: #fef2f2;
    color: var(--danger);
}

.drawer-pill-danger:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
}

/* GLASS TOAST NOTIFICATION */
.toast-container {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}

.glass-toast {
    background: rgba(20, 23, 43, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.22);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 500;
    box-shadow: 0 14px 32px rgba(15, 20, 55, 0.28);
    animation: toastSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes toastSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* RESPONSIVE */
@media (max-width: 1100px) {
    .jobs-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .search-bar-row {
        grid-template-columns: 1fr 1fr;
    }
    .search-submit-btn {
        grid-column: span 2;
        height: 46px;
    }
}

@media (max-width: 780px) {
    .brand-logo {
        height: 42px;

        width: 100%;

    }
    .drawer-scroll-body {
        padding: 0 20px 20px;
    }
    .drawer-avatar-row {
        padding: 0 20px;
    }
}

class EquiWorkApi {
    static getHeaders() {
        const headers = {
            "Content-Type": "application/json",
            "Accept": "application/json"
        };
        const jwt = localStorage.getItem("equiwork_jwt");
        if (jwt) {
            headers["Authorization"] = `Bearer ${jwt}`;
        }
        const xsrfMatch = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
        if (xsrfMatch) {
            headers["X-XSRF-TOKEN"] = decodeURIComponent(xsrfMatch[1]);
        }
        return headers;
    }

    static normalizeJobDTO(dto) {
        const typeBadgeMap = {
            "Part-time": "badge-amber",
            "Full-time": "badge-green",
            "On-call / Day Rate": "badge-blue",
            "Contract": "badge-pink"
        };
        const currency = dto.currency || "₱";
        const rateAmount = Number(dto.rateAmount ?? dto.salaryMin ?? 0);
        const rateUnit = dto.rateUnit || "day";
        const formattedPay = dto.salaryFormatted || `${currency}${rateAmount.toLocaleString()} / ${rateUnit}`;

        const monthlyEquivalent = rateUnit === "day" ? rateAmount * 22 : rateAmount;
        const company = dto.companyName || dto.company || "Verified Employer";
        const initials = dto.companyInitials || company.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

        return {
            id: dto.id,
            featured: Boolean(dto.featured),
            initials,
            avatarBg: dto.avatarGradient || "linear-gradient(135deg, #261fc4, #15117a)",
            bannerGradient: dto.bannerGradient || "linear-gradient(125deg, rgba(235, 179, 52, 0.52), rgba(53, 47, 209, 0.48))",
            badgeText: dto.employmentType || "Part-time",
            badgeClass: dto.featured ? "badge-glass" : (typeBadgeMap[dto.employmentType] || "badge-blue"),
            title: dto.title,
            company,
            category: dto.category || "Household & Care",
            location: dto.location || "Batangas City",
            employmentType: dto.employmentType || "Part-time",
            rateAmount,
            rateUnit,
            monthlyEquivalent,
            payDisplay: formattedPay,
            startSchedule: dto.startSchedule || "Tomorrow, 8:00 AM",
            startsTomorrow: Boolean(dto.startsTomorrow),
            applicantsCount: dto.applicantsCount ?? 0,
            postedDaysAgo: dto.postedDaysAgo ?? 0,
            posted: dto.postedLabel || (dto.postedDaysAgo === 0 ? "Posted just now" : `${dto.postedDaysAgo} days ago`),
            description: dto.description || "",
            highlights: Array.isArray(dto.highlights) ? dto.highlights : [],
            saved: Boolean(dto.saved),
            applicationStatus: dto.applicationStatus || null
        };
    }

    static async fetchJobs(filters = {}) {
        if (!API_CONFIG.USE_MOCK_DATA) {
            const params = new URLSearchParams();
            if (filters.keyword) params.set("keyword", filters.keyword);
            if (filters.location) params.set("location", filters.location);
            if (filters.category) params.set("category", filters.category);
            if (filters.minPay) params.set("minPay", filters.minPay);
            if (filters.employmentTypes?.length) params.set("types", filters.employmentTypes.join(","));
            if (filters.sort) params.set("sort", filters.sort);

            const res = await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.ENDPOINTS.JOBS}?${params.toString()}`, {
                method: "GET",
                headers: this.getHeaders(),
                credentials: "include"
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const items = Array.isArray(data) ? data : (data.content || []);
            return items.map(this.normalizeJobDTO);
        }

        await new Promise(r => setTimeout(r, 100));
        let results = SEED_JOBS_DTO.map(this.normalizeJobDTO);

        if (filters.keyword) {
            const q = filters.keyword.toLowerCase();
            results = results.filter(j =>
                j.title.toLowerCase().includes(q) ||
                j.category.toLowerCase().includes(q) ||
                j.company.toLowerCase().includes(q)
            );
        }
        if (filters.location) {
            const loc = filters.location.toLowerCase();
            results = results.filter(j => j.location.toLowerCase().includes(loc));
        }
        if (filters.category) {
            results = results.filter(j => j.category === filters.category);
        }
        if (filters.employmentTypes?.length) {
            results = results.filter(j => filters.employmentTypes.includes(j.employmentType));
        }
        if (filters.minPay > 0) {
            results = results.filter(j => j.rateAmount >= filters.minPay || j.monthlyEquivalent >= filters.minPay);
        }
        if (filters.quickChip === "tomorrow") {
            results = results.filter(j => j.startsTomorrow);
        } else if (filters.quickChip === "highpay") {
            results = results.filter(j => (j.rateUnit === "day" && j.rateAmount >= 600) || j.monthlyEquivalent >= 15000);
        } else if (filters.quickChip === "batangas") {
            results = results.filter(j => j.location.toLowerCase().includes("batangas"));
        } else if (filters.quickChip === "laguna") {
            results = results.filter(j => j.location.toLowerCase().includes("laguna"));
        }

        if (filters.sort === "salary_desc") {
            results.sort((a, b) => b.monthlyEquivalent - a.monthlyEquivalent);
        } else if (filters.sort === "recent") {
            results.sort((a, b) => a.postedDaysAgo - b.postedDaysAgo);
        }

        return results;
    }

    static async toggleBookmark(jobId, currentlySaved) {
        if (!API_CONFIG.USE_MOCK_DATA) {
            const res = await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.ENDPOINTS.TOGGLE_SAVE(jobId)}`, {
                method: currentlySaved ? "DELETE" : "POST",
                headers: this.getHeaders(),
                credentials: "include"
            });
            if (!res.ok) throw new Error(`Bookmark failed (${res.status})`);
        }
        return !currentlySaved;
    }

    static async submitApplication(jobId, payload) {
        if (!API_CONFIG.USE_MOCK_DATA) {
            const res = await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.ENDPOINTS.APPLY_JOB(jobId)}`, {
                method: "POST",
                headers: this.getHeaders(),
                credentials: "include",
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`Application failed (${res.status})`);
            return await res.json();
        }
        await new Promise(r => setTimeout(r, 180));
        return { status: "NOT_STARTED", jobId, submittedAt: new Date().toISOString() };
    }

    static async cancelApplication(jobId, reason) {
        if (!API_CONFIG.USE_MOCK_DATA) {
            const res = await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.ENDPOINTS.CANCEL_JOB(jobId)}`, {
                method: "DELETE",
                headers: this.getHeaders(),
                credentials: "include",
                body: JSON.stringify({ reason })
            });
            if (!res.ok) throw new Error(`Cancellation failed (${res.status})`);
        }
        await new Promise(r => setTimeout(r, 180));
        return { status: "CANCELLED", jobId };
    }
}

function escapeHtml(str) {
    return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function showToast(message) {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = "glass-toast";
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.25s ease";
        setTimeout(() => toast.remove(), 260);
    }, 3200);
}

 * NOTIFICATIONS SIDE-DROP POPOVER
 * ============================================================================ */
const notifPopover = document.getElementById("notifPopover");
const notifToggleBtn = document.getElementById("notifToggleBtn");

function closeNotifPopover() {
    notifPopover.classList.remove("open");
    notifToggleBtn.classList.remove("active");
    notifToggleBtn.setAttribute("aria-expanded", "false");
}

notifToggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !notifPopover.classList.contains("open");
    closeNotifPopover();
    if (willOpen) {
        notifPopover.classList.add("open");
        notifToggleBtn.classList.add("active");
        notifToggleBtn.setAttribute("aria-expanded", "true");
    }
});

document.addEventListener("click", (e) => {
    if (!document.getElementById("notifAnchor").contains(e.target)) {
        closeNotifPopover();
    }
});

function renderJobs() {
    let list = [...state.jobs];

    if (state.activeTab === "saved") {
        list = list.filter(j => state.savedIds.has(j.id));
    } else if (state.activeTab === "applied") {
        list = list.filter(j => state.applications.has(j.id));
    }

    const labelSuffix = state.activeTab === "saved" ? "saved odd job" :
                        state.activeTab === "applied" ? "application" : "available odd job";
    resultsCount.textContent = `Showing ${list.length} ${labelSuffix}${list.length === 1 ? "" : "s"}`;

    if (list.length === 0) {
        jobsGrid.innerHTML = `
            <div style="grid-column: 1 / -1; background: rgba(255,255,255,0.88); padding: 44px; border-radius: 16px; text-align: center;">
                <h3 style="color: #1f2247; margin-bottom: 8px;">No odd jobs found</h3>
                <p style="color: #5a6078; font-size: 14px;">Try switching tabs or resetting your search filters.</p>
            </div>
        `;
        return;
    }

    jobsGrid.innerHTML = list.map((job, idx) => {
        const isSaved = state.savedIds.has(job.id);
        const appRecord = state.applications.get(job.id);
        const isNotStarted = appRecord?.status === "NOT_STARTED";
        const isInProgress = appRecord?.status === "IN_PROGRESS";

        let actionButtonHtml = `
            <button type="button" class="card-mini-btn primary" data-quick-apply-id="${job.id}">
                Apply Now

                : `<button type="button" class="card-mini-btn applied" data-open-id="${job.id}">Scheduled ✓</button>`;
        } else if (isInProgress) {
            actionButtonHtml = `<button type="button" class="card-mini-btn applied" data-open-id="${job.id}">In Progress</button>`;

            ? `<span class="status-chip status-not-started">Not Started</span>`
            : isInProgress

                : "";

        return `
            <article class="job-card ${job.featured ? "featured" : ""}" data-job-id="${job.id}" style="animation-delay: ${idx * 35}ms;">
                ${job.featured ? `<div class="top-pick-badge">TOP PICK</div>` : ""}

                        <h3 class="job-card-title">${escapeHtml(job.title)}</h3>

                        <div class="schedule-tag">

                            ${escapeHtml(job.startSchedule)}
                        </div>
                    </div>
                </div>

                <div class="card-bottom-info">
                    <div class="job-meta-row">
                        <span class="job-meta-item">

    const appRecord = state.applications.get(job.id);
    const isNotStarted = appRecord?.status === "NOT_STARTED";
    const isInProgress = appRecord?.status === "IN_PROGRESS";

    let primaryFooterBtnHtml = `
        <button type="button" class="drawer-pill-btn drawer-pill-primary" id="drawerApplyBtn">

    if (isNotStarted) {

            cancelBox.classList.toggle("open");

                await EquiWorkApi.submitApplication(job.id, { coverNote: note });

                updateNavBadges();
                renderJobs();
                openJobDrawer(job.id, "view");
                showToast(`Application sent for ${job.title} (${job.startSchedule})`);
            } catch (err) {
                confirmBtn.disabled = false;
                confirmBtn.textContent = "Confirm & Send Application";
                showToast("Could not submit application. Check backend connection.");
            }
        });
    }

    const confirmCancelBtn = document.getElementById("confirmCancelBtn");
    if (confirmCancelBtn) {
        confirmCancelBtn.addEventListener("click", async () => {
            confirmCancelBtn.disabled = true;
            confirmCancelBtn.textContent = "Cancelling...";
            const reason = document.getElementById("cancelReasonSelect").value;

            try {
                await EquiWorkApi.cancelApplication(job.id, reason);
                state.applications.delete(job.id);
                const seedItem = SEED_JOBS_DTO.find(s => s.id === job.id);
                if (seedItem) seedItem.applicationStatus = null;

                updateNavBadges();
                renderJobs();
                openJobDrawer(job.id, "view");
                showToast(`Cancelled "${job.title}". Slot released to employer.`);
            } catch (err) {
                confirmCancelBtn.disabled = false;
                confirmCancelBtn.textContent = "Confirm Job Cancellation";
                showToast("Could not cancel job right now.");
            }
        });
    }
}

function closeJobDrawer() {
    drawerBackdrop.classList.remove("open");
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
}

async function handleToggleSave(jobId) {
    const currentlySaved = state.savedIds.has(jobId);
    try {
        const nowSaved = await EquiWorkApi.toggleBookmark(jobId, currentlySaved);
        if (nowSaved) {
            state.savedIds.add(jobId);
            showToast("Odd job saved to your bookmarks");
        } else {
            state.savedIds.delete(jobId);
            showToast("Removed from saved jobs");
        }
        updateNavBadges();
        renderJobs();
    } catch (err) {
        showToast("Failed to update bookmark");
    }
}

function gatherFilters() {
    const keyword = (document.getElementById("topKeywordInput").value || document.getElementById("sideTitleInput").value).trim();
    const location = (document.getElementById("topLocationInput").value || document.getElementById("sideLocationInput").value).trim();
    const topType = document.getElementById("topTypeSelect").value;
    const category = document.getElementById("sideCategorySelect").value;
    const sort = document.getElementById("sortSelect").value;

    const rawPay = document.getElementById("topSalaryInput").value.replace(/[^\d]/g, "");
    const minPay = rawPay ? Number(rawPay) : 0;

    const checkedTypes = Array.from(document.querySelectorAll("#employmentCheckboxes input:checked")).map(cb => cb.value);
    const employmentTypes = topType ? Array.from(new Set([topType, ...checkedTypes])) : checkedTypes;

    return { keyword, location, category, minPay, employmentTypes, sort, quickChip: state.quickChip };
}

async function loadFilteredJobs() {
    renderSkeletons();
    try {
        const filters = gatherFilters();
        const jobs = await EquiWorkApi.fetchJobs(filters);
        state.jobs = jobs;

        if (!state.initializedDefaults) {
            jobs.forEach(j => {
                if (j.saved) state.savedIds.add(j.id);
                if (j.applicationStatus) {
                    state.applications.set(j.id, { status: j.applicationStatus });
                }
            });
            state.initializedDefaults = true;
        }
        updateNavBadges();
        renderJobs();
    } catch (err) {
        resultsCount.textContent = "Unable to load jobs";
        jobsGrid.innerHTML = `
            <div style="grid-column: 1 / -1; background: rgba(255,255,255,0.9); padding: 36px; border-radius: 16px; text-align: center;">
                <h3 style="color: #b91c1c; margin-bottom: 8px;">Backend Connection Error</h3>
                <p style="color: #5a6078; font-size: 14px;">Could not reach Spring Boot API at <code>${escapeHtml(API_CONFIG.BASE_URL)}</code>.</p>
            </div>
        `;
    }
}

function debounce(fn, delay = 250) {
    let timer;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}

// Event Delegation on Job Grid
jobsGrid.addEventListener("click", (e) => {
    const saveBtn = e.target.closest("[data-save-id]");
    if (saveBtn) {
        e.stopPropagation();
        handleToggleSave(Number(saveBtn.dataset.saveId));
        return;
    }

    const quickApplyBtn = e.target.closest("[data-quick-apply-id]");
    if (quickApplyBtn) {
        e.stopPropagation();
        openJobDrawer(quickApplyBtn.dataset.quickApplyId, "apply");
        return;
    }

    const cancelBtn = e.target.closest("[data-cancel-id]");
    if (cancelBtn) {
        e.stopPropagation();
        openJobDrawer(cancelBtn.dataset.cancelId, "cancel");
        return;
    }

    const card = e.target.closest("[data-job-id]");
    if (card) {
        openJobDrawer(card.dataset.jobId, "view");
    }
});

// Navbar Tabs (Find Odd Jobs / My Applications / Saved Jobs)
document.getElementById("navTabs").addEventListener("click", (e) => {
    const tabBtn = e.target.closest("[data-tab]");
    if (!tabBtn) return;
    document.querySelectorAll("#navTabs .nav-link").forEach(btn => btn.classList.remove("active"));
    tabBtn.classList.add("active");
    state.activeTab = tabBtn.dataset.tab;
    renderJobs();
});

// Quick Filter Chips
document.getElementById("quickChipsRow").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-chip]");
    if (!chip) return;
    document.querySelectorAll("#quickChipsRow .quick-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    state.quickChip = chip.dataset.chip;
    loadFilteredJobs();
});

// Board vs. List View Switcher
document.getElementById("viewToggleBtn").addEventListener("click", (e) => {
    state.viewMode = state.viewMode === "board" ? "list" : "board";
    jobsGrid.classList.toggle("list-view", state.viewMode === "list");
    e.target.textContent = state.viewMode === "board" ? "Board View ▾" : "List View ▾";
});

// Collapsible Sidebar Filter Groups
document.querySelectorAll(".filter-sidebar .filter-label").forEach(label => {
    label.addEventListener("click", () => {
        label.closest(".filter-group").classList.toggle("collapsed");
    });
});

drawerBackdrop.addEventListener("click", closeJobDrawer);
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        closeNotifPopover();
        closeJobDrawer();
    }
});

// Debounced Search & Filter Bindings
const debouncedSearch = debounce(loadFilteredJobs, 250);
document.getElementById("searchBtn").addEventListener("click", loadFilteredJobs);
document.getElementById("topKeywordInput").addEventListener("input", debouncedSearch);
document.getElementById("sideTitleInput").addEventListener("input", debouncedSearch);
document.getElementById("topLocationInput").addEventListener("input", debouncedSearch);
document.getElementById("sideLocationInput").addEventListener("input", debouncedSearch);
document.getElementById("topSalaryInput").addEventListener("input", debouncedSearch);
document.getElementById("topTypeSelect").addEventListener("change", loadFilteredJobs);
document.getElementById("sideCategorySelect").addEventListener("change", loadFilteredJobs);
document.getElementById("employmentCheckboxes").addEventListener("change", loadFilteredJobs);
document.getElementById("sortSelect").addEventListener("change", loadFilteredJobs);

document.getElementById("resetFiltersBtn").addEventListener("click", () => {
    document.getElementById("topKeywordInput").value = "";
    document.getElementById("sideTitleInput").value = "";
    document.getElementById("topLocationInput").value = "";
    document.getElementById("sideLocationInput").value = "";
    document.getElementById("topSalaryInput").value = "";
    document.getElementById("topTypeSelect").value = "";
    document.getElementById("sideCategorySelect").value = "";
    document.getElementById("sortSelect").value = "recommended";
    document.querySelectorAll("#employmentCheckboxes input").forEach(cb => cb.checked = false);
    state.quickChip = "all";
    document.querySelectorAll("#quickChipsRow .quick-chip").forEach(c => {
        c.classList.toggle("active", c.dataset.chip === "all");
    });
    loadFilteredJobs();
});

// Initial Fetch
loadFilteredJobs();
</script>

</body>

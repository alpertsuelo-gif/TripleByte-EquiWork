<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EquiWork | Role Preferences</title>

  <style>
    :root {
      --primary: #261fc4;
      --primary-dark: #15117a;
      --accent-gold: #ffd954;
      --accent-gold-hover: #f4c830;
      --accent-gold-ink: #b8860b;
      --heading-color: #1f2247;
      --text-main: #222638;
      --text-muted: #4b5068;
      --error-red: #b91c1c;
      --glass-bg: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.92);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 16px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      background: transparent;
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* BACKGROUND */
    .background-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: -1;
    }

    /* WRAPPER */
    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      animation: cardFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* GLASS CARD CONTAINER */
    .register-card {
      position: relative;
      width: 100%;
      padding: 38px 54px 40px;
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      backdrop-filter: blur(36px) saturate(160%);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow:
        0 24px 60px rgba(15, 20, 55, 0.22),
        0 4px 16px rgba(15, 20, 55, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    /* TOP PROGRESS & LOGO ROW */
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-pills {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      width: 76px;
      height: 11px;
      border-radius: 99px;
      background: rgba(180, 184, 197, 0.45);
      transition: background 0.25s ease;
    }

    .pill.is-active {
      background: var(--accent-gold);
      box-shadow: 0 2px 6px rgba(255, 217, 84, 0.45);
    }

    .logo-placeholder {
      width: 105px;
      height: 54px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* BRIEFCASE ICON */
    .icon-badge {
      margin-bottom: 18px;
    }

    .icon-badge img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply;
    }

    /* QUESTION HEADER */
    .question-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--heading-color);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .question-sub {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    /* INPUT FIELD */
    .input-group {
      position: relative;
      width: 100%;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 92px 0 18px;
      border: 1.5px solid #b4b8c5;
      border-radius: 10px;
      background: rgba(241, 243, 248, 0.85);
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: #9ba0b0;
    }

    .form-input:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: #8f95a8;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(38, 31, 196, 0.14);
    }

    .form-input.input-error {
      border-color: var(--error-red);
    }

    .add-role-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: 7px;
      background: var(--heading-color);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .add-role-btn:hover {
      opacity: 0.88;
    }

    .validation-hint {
      font-size: 12.5px;
      font-style: italic;
      font-weight: 500;
      color: var(--error-red);
      min-height: 18px;
      margin-bottom: 14px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }

    .validation-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    /* ADDED ROLE TITLES SECTION */
    .added-section {
      margin-bottom: 34px;
    }

    .added-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--heading-color);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .role-counter {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .role-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      min-height: 36px;
    }

    .empty-roles {
      font-size: 13.5px;
      color: #888ea3;
      font-style: italic;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 99px;
      background: #fef5d4;
      border: 1px solid #f4c830;
      color: #5c4305;
      font-size: 13.5px;
      font-weight: 600;
      animation: chipPop 0.2s ease;
    }

    @keyframes chipPop {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .role-chip button {
      background: none;
      border: none;
      color: #7a5a12;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }

    .role-chip button:hover {
      color: var(--error-red);
    }

    /* FOOTER NAVIGATION (BACK & NEXT) */
    .nav-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 8px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: #d99b16;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-decoration: none;
      padding: 8px 4px;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .btn-back:hover {
      transform: translateX(-3px);
      opacity: 0.85;
    }

    .btn-back svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    .btn-next {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 175px;
      height: 48px;
      padding: 0 26px;
      border: none;
      border-radius: 99px;
      background: var(--accent-gold);
      color: #111827;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(244, 179, 35, 0.35);
      transition: all 0.2s ease;
    }

    .btn-next:hover {
      background: var(--accent-gold-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(244, 179, 35, 0.45);
    }

    .btn-next:active {
      transform: translateY(0);
    }

    .btn-next svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .register-card {
        padding: 30px 24px 32px;
      }

      .top-bar {
        flex-direction: column-reverse;
        gap: 14px;
      }

      .pill {
        width: 64px;
      }

      .question-title {
        font-size: 22px;
      }

      .btn-next {
        min-width: 145px;
      }
    }
  </style>
</head>

<body>
  <!-- BACKGROUND HTML -->
  <iframe src="background-template.html" class="background-frame" title="EquiWork Background"></iframe>

  <!-- WRAPPER -->
  <div class="card-wrapper">
    <main class="register-card">
      <!-- TOP STEP INDICATOR & LOGO -->
      <div class="top-bar">
        <div class="progress-section">
          <span class="step-label">Question 1 of 3</span>
          <div class="progress-pills" aria-label="Step 1 of 3">
            <span class="pill is-active"></span>
            <span class="pill"></span>
            <span class="pill"></span>
          </div>
        </div>

        <img src="EquiWork-Logo-removebg-preview.png" alt="EquiWork Logo" class="logo-placeholder" />
      </div>

      <!-- BRIEFCASE ICON -->
      <div class="icon-badge" aria-hidden="true">
        <img src="icon-briefcase-removebg-preview.png" alt="Briefcase role icon" />
      </div>

      <!-- QUESTION PROMPT -->
      <h1 class="question-title">
        What type of roles are you most interested in?
      </h1>
      <p class="question-sub">
        Add at least 1 up to 10 role titles so we can recommend the right jobs
        for you.
      </p>

      <!-- INPUT & TAG LIST -->
      <form id="roleForm" novalidate>
        <div class="input-group">
          <input type="text" id="roleInput" class="form-input" placeholder="Enter role title" autocomplete="off" />
          <button type="button" class="add-role-btn" id="addRoleBtn">
            + Add
          </button>
        </div>

        <div class="validation-hint" id="roleHint" role="alert">
          Please add at least 1 role title to continue.
        </div>

        <div class="added-section">
          <div class="added-heading">
            <span>Added role titles</span>
            <span class="role-counter" id="roleCounter">0 / 10</span>
          </div>
          <div class="role-tags" id="roleTags">
            <span class="empty-roles" id="emptyRolesText">
              No roles added yet. Type a role above and press Enter or Add.
            </span>
          </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="nav-footer">
          <a href="register-employee.html" class="btn-back">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>BACK</span>
          </a>

          <button type="submit" class="btn-next">
            <span>NEXT</span>
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const roleForm = document.getElementById("roleForm");
    const roleInput = document.getElementById("roleInput");
    const addRoleBtn = document.getElementById("addRoleBtn");
    const roleTags = document.getElementById("roleTags");
    const roleCounter = document.getElementById("roleCounter");
    const roleHint = document.getElementById("roleHint");

    let roles = [];

    function showError(msg) {
      roleHint.textContent = msg;
      roleHint.classList.add("visible");
      roleInput.classList.add("input-error");
    }

    function clearError() {
      roleHint.classList.remove("visible");
      roleInput.classList.remove("input-error");
    }

    function renderRoles() {
      roleCounter.textContent = `${roles.length} / 10`;

      if (roles.length === 0) {
        roleTags.innerHTML = `<span class="empty-roles">No roles added yet. Type a role above and press Enter or Add.</span>`;
        return;
      }

      roleTags.innerHTML = roles
        .map(
          (role, index) => `
            <span class="role-chip">
              <span>${role}</span>
              <button type="button" data-index="${index}" aria-label="Remove ${role}">×</button>
            </span>
          `,
        )
        .join("");
    }

    function addRole() {
      const value = roleInput.value.trim();
      if (!value) return;

      if (roles.length >= 10) {
        showError("You can add up to 10 role titles maximum.");
        return;
      }

      const alreadyExists = roles.some(
        (r) => r.toLowerCase() === value.toLowerCase(),
      );
      if (alreadyExists) {
        showError("This role title has already been added.");
        return;
      }

      roles.push(value);
      roleInput.value = "";
      clearError();
      renderRoles();
      roleInput.focus();
    }

    addRoleBtn.addEventListener("click", addRole);

    roleInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addRole();
      }
    });

    roleInput.addEventListener("input", () => {
      if (roleInput.value.trim().length > 0) clearError();
    });

    roleTags.addEventListener("click", (e) => {
      const removeBtn = e.target.closest("button[data-index]");
      if (!removeBtn) return;
      const idx = Number(removeBtn.dataset.index);
      roles.splice(idx, 1);
      clearError();
      renderRoles();
    });

    roleForm.addEventListener("submit", (e) => {
      e.preventDefault();

      // 1. Validate that at least one role has been added
      if (roles.length === 0) {
        showError("Please add at least 1 role title to continue.");
        roleInput.focus();
        return;
      }

      // 2. Save the selected roles to localStorage so they aren't lost
      localStorage.setItem("equiwork_user_roles", JSON.stringify(roles));

      // 3. Redirect the user directly to Step 2
      window.location.href = "register-employee_2.html";
    });
  </script>
</body>

</html>

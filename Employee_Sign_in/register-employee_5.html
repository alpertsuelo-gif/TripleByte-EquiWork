<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EquiWork | Tell us about your work</title>

  <style>
    :root {
      --primary: #261fc4;
      --primary-dark: #15117a;
      --accent-gold: #ffd954;
      --accent-gold-hover: #f4c830;
      --accent-gold-ink: #b8860b;
      --heading-color: #1f2247;
      --text-main: #222638;
      --text-muted: #4b5068;
      --error-red: #b91c1c;
      --success-green: #15803d;
      --success-bg: rgba(220, 252, 231, 0.72);
      --glass-bg: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.92);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 16px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      background: transparent;
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* BACKGROUND */
    .background-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: -1;
    }

    /* WRAPPER */
    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      animation: cardFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* GLASS CARD CONTAINER */
    .register-card {
      position: relative;
      width: 100%;
      padding: 40px 54px 40px;
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      backdrop-filter: blur(36px) saturate(160%);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow:
        0 24px 60px rgba(15, 20, 55, 0.22),
        0 4px 16px rgba(15, 20, 55, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    /* FOCUS ACCESSIBILITY */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 2.5px solid var(--primary);
      outline-offset: 2px;
    }

    /* TITLE & ILLUSTRATION */
    .card-header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .question-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--heading-color);
      margin-bottom: 6px;
    }

    .question-sub {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .illustration-badge img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply;
    }

    /* ADD ROLE TRIGGER CARD */
    .add-role-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 6px;
    }

    .add-role-trigger {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px 10px 10px;
      background: rgba(255, 255, 255, 0.72);
      border: 1.5px solid rgba(180, 184, 197, 0.55);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(15, 20, 55, 0.05);
    }

    .add-role-trigger:hover {
      background: #ffffff;
      border-color: var(--accent-gold-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(244, 179, 35, 0.18);
    }

    .add-role-trigger[aria-expanded="true"] {
      background: #ffffff;
      border-color: var(--accent-gold-hover);
    }

    .add-role-icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      background: var(--accent-gold);
      border-radius: 10px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(244, 179, 35, 0.28);
      transition: background 0.2s ease;
    }

    .add-role-trigger:hover .add-role-icon-box {
      background: var(--accent-gold-hover);
    }

    .add-role-icon-box svg {
      width: 22px;
      height: 22px;
      stroke: #111827;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .add-role-text-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .add-role-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--heading-color);
      line-height: 1.25;
    }

    .add-role-hint {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* INLINE ROLE PANEL */
    .role-panel {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.78);
      border: 1.5px solid rgba(180, 184, 197, 0.55);
      border-radius: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: panelSlide 0.2s ease;
    }

    .role-panel.is-open {
      display: flex;
    }

    @keyframes panelSlide {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .role-input-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      font-size: 14.5px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .role-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(38, 31, 196, 0.12);
    }

    .role-add-btn {
      height: 44px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: var(--heading-color);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .role-add-btn:hover {
      opacity: 0.9;
    }

    .role-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      background: #fef5d4;
      border: 1px solid #f4c830;
      color: #5c4305;
      font-size: 13px;
      font-weight: 600;
    }

    .role-chip button {
      background: none;
      border: none;
      color: #7a5a12;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }

    .role-chip button:hover {
      color: var(--error-red);
    }

    /* DIVIDER WITH "OR" */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 20px 0;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      flex: 1;
      height: 1.5px;
      background: rgba(148, 163, 184, 0.45);
    }

    .or-divider span {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    /* RESUME DROPZONE */
    .dropzone {
      position: relative;
      border: 2px dashed #f4b323;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 22px;
    }

    .dropzone:hover,
    .dropzone.dragover {
      background: rgba(254, 245, 212, 0.55);
      border-color: var(--accent-gold-hover);
      box-shadow: 0 6px 18px rgba(244, 179, 35, 0.14);
    }

    .dropzone.has-file {
      border-style: solid;
      border-color: #22c55e;
      background: var(--success-bg);
    }

    .dropzone-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .dropzone-text {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--heading-color);
    }

    .dropzone-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .browse-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 18px;
      background: var(--accent-gold);
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: #111827;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(244, 179, 35, 0.25);
      transition: all 0.18s ease;
    }

    .browse-btn:hover {
      background: var(--accent-gold-hover);
    }

    .dropzone-sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    .file-pill {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 99px;
      background: #ffffff;
      border: 1px solid #bbf7d0;
      color: var(--success-green);
      font-size: 13px;
      font-weight: 600;
      max-width: 100%;
    }

    .file-pill.visible {
      display: inline-flex;
    }

    .file-pill-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 260px;
    }

    .file-pill-size {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
      flex-shrink: 0;
    }

    .file-remove-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .file-remove-btn:hover {
      color: var(--error-red);
    }

    .dropzone-file-icon {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(255, 217, 84, 0.22);
      color: #d99b16;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .dropzone:hover .dropzone-file-icon {
      transform: translateY(-2px);
      background: rgba(255, 217, 84, 0.34);
    }

    .dropzone.has-file .dropzone-file-icon {
      background: rgba(34, 197, 94, 0.16);
      color: var(--success-green);
    }

    .dropzone-file-icon svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .file-input-hidden {
      display: none;
    }

    .validation-hint {
      font-size: 13px;
      font-style: italic;
      font-weight: 500;
      color: var(--error-red);
      text-align: center;
      min-height: 18px;
      margin-top: -12px;
      margin-bottom: 14px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }

    .validation-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    /* FOOTER NAVIGATION (BACK & NEXT) */
    .nav-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: #d99b16;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-decoration: none;
      padding: 8px 4px;
      border-radius: 8px;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .btn-back:hover {
      transform: translateX(-3px);
      opacity: 0.85;
    }

    .btn-back svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    .btn-next {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 175px;
      height: 48px;
      padding: 0 26px;
      border: none;
      border-radius: 99px;
      background: var(--accent-gold);
      color: #111827;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(244, 179, 35, 0.35);
      transition: all 0.2s ease;
    }

    .btn-next:hover {
      background: var(--accent-gold-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(244, 179, 35, 0.45);
    }

    .btn-next:active {
      transform: translateY(0);
    }

    .btn-next svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .register-card {
        padding: 30px 24px 32px;
      }

      .dropzone {
        flex-direction: column-reverse;
        text-align: center;
        padding: 20px 16px;
      }

      .dropzone-content {
        align-items: center;
      }

      .dropzone-actions {
        justify-content: center;
      }

      .file-pill-name {
        max-width: 170px;
      }

      .question-title {
        font-size: 24px;
      }

      .btn-next {
        min-width: 145px;
      }
    }
  </style>
</head>

<body>
  <!-- BACKGROUND HTML -->
  <iframe src="background-template.html" class="background-frame" title="EquiWork Background"></iframe>

  <!-- WRAPPER -->
  <div class="card-wrapper">
    <main class="register-card">
      <!-- HEADER & DOCUMENT ICON -->
      <div class="card-header-center">
        <h1 class="question-title">Tell us about your work</h1>
        <p class="question-sub">
          Add your recent roles or upload a resume so we can match you faster.
        </p>
        <div class="illustration-badge" aria-hidden="true">
          <img src="icon-work-scroll-removebg-preview.png" alt="Work details document icon" />
        </div>
      </div>

      <!-- ADD ROLE TRIGGER & INLINE PANEL -->
      <div class="add-role-section">
        <button type="button" class="add-role-trigger" id="triggerAddRole" aria-expanded="false"
          aria-controls="rolePanel">
          <span class="add-role-icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
          </span>
          <span class="add-role-text-group">
            <span class="add-role-label">Add role</span>
            <span class="add-role-hint">Enter a job title or past position</span>
          </span>
        </button>

        <div class="role-panel" id="rolePanel">
          <div class="role-input-row">
            <input type="text" id="workRoleInput" class="role-input"
              placeholder="e.g. Carpenter, Landscaper, Barber, Nail Tech" autocomplete="off"
              aria-label="Job role title" />
            <button type="button" class="role-add-btn" id="addWorkRoleBtn">+ Add</button>
          </div>
          <div class="role-chips" id="workRoleChips" aria-live="polite"></div>
        </div>
      </div>

      <!-- OR DIVIDER -->
      <div class="or-divider" aria-hidden="true">
        <span>OR</span>
      </div>

      <!-- RESUME DROPZONE FORM -->
      <form id="workForm" novalidate>
        <div class="dropzone" id="dropzoneBox" role="button" tabindex="0"
          aria-label="Upload your resume. Supported formats: PDF, DOC, DOCX, TXT up to 5 MB.">
          <div class="dropzone-content">
            <span class="dropzone-text">Upload your resume here</span>
            <div class="dropzone-actions">
              <button type="button" class="browse-btn" id="browseBtn">
                Browse
              </button>
              <span class="dropzone-sub" id="dropzoneSubText">
                or drag &amp; drop (PDF, DOC, DOCX, TXT • max 5 MB)
              </span>
            </div>
            <div class="file-pill" id="filePill">
              <span class="file-pill-name" id="fileNameDisplay"></span>
              <span class="file-pill-size" id="fileSizeDisplay"></span>
              <button type="button" class="file-remove-btn" id="removeFileBtn"
                aria-label="Remove uploaded file">×</button>
            </div>
          </div>

          <!-- INLINE SVG RESUME FILE ICON -->
          <div class="dropzone-file-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <path d="M12 18v-6"></path>
              <path d="M9.5 14.5L12 12l2.5 2.5"></path>
            </svg>
          </div>

          <input type="file" id="resumeInput" class="file-input-hidden" accept=".pdf,.doc,.docx,.txt" />
        </div>

        <div class="validation-hint" id="workHint" role="alert">
          Please add at least one role or upload your resume to continue.
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="nav-footer">
          <a href="register-employee_4.html" class="btn-back">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>BACK</span>
          </a>

          <button type="submit" class="btn-next">
            <span>NEXT</span>
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const MAX_FILE_BYTES = 5 * 1024 * 1024;
    const ALLOWED_EXTENSIONS = [".pdf", ".doc", ".docx", ".txt"];

    const workForm = document.getElementById("workForm");
    const dropzoneBox = document.getElementById("dropzoneBox");
    const browseBtn = document.getElementById("browseBtn");
    const resumeInput = document.getElementById("resumeInput");
    const dropzoneSubText = document.getElementById("dropzoneSubText");
    const filePill = document.getElementById("filePill");
    const fileNameDisplay = document.getElementById("fileNameDisplay");
    const fileSizeDisplay = document.getElementById("fileSizeDisplay");
    const removeFileBtn = document.getElementById("removeFileBtn");
    const triggerAddRole = document.getElementById("triggerAddRole");
    const rolePanel = document.getElementById("rolePanel");
    const workRoleInput = document.getElementById("workRoleInput");
    const addWorkRoleBtn = document.getElementById("addWorkRoleBtn");
    const workRoleChips = document.getElementById("workRoleChips");
    const workHint = document.getElementById("workHint");

    let uploadedFile = null;
    let workRoles = [];

    try {
      const saved = JSON.parse(localStorage.getItem("equiwork_work_roles") || "[]");
      if (Array.isArray(saved) && saved.length > 0) {
        workRoles = saved;
        rolePanel.classList.add("is-open");
        triggerAddRole.setAttribute("aria-expanded", "true");
        renderWorkRoles();
      }
    } catch {
      workRoles = [];
    }

    function showError(msg) {
      workHint.textContent = msg;
      workHint.classList.add("visible");
    }

    function clearError() {
      workHint.classList.remove("visible");
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function renderWorkRoles() {
      workRoleChips.textContent = "";
      workRoles.forEach((role, index) => {
        const chip = document.createElement("span");
        chip.className = "role-chip";

        const label = document.createElement("span");
        label.textContent = role;

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.dataset.index = String(index);
        removeBtn.setAttribute("aria-label", `Remove ${role}`);
        removeBtn.textContent = "×";

        chip.append(label, removeBtn);
        workRoleChips.appendChild(chip);
      });
    }

    function addWorkRole() {
      const value = workRoleInput.value.trim();
      if (!value) return;

      const exists = workRoles.some((r) => r.toLowerCase() === value.toLowerCase());
      if (exists) {
        showError("This role has already been added.");
        return;
      }

      workRoles.push(value);
      workRoleInput.value = "";
      clearError();
      renderWorkRoles();
      workRoleInput.focus();
    }

    function setUploadedFile(file) {
      if (!file) return;

      const lowerName = file.name.toLowerCase();
      const hasValidExt = ALLOWED_EXTENSIONS.some((ext) => lowerName.endsWith(ext));
      if (!hasValidExt) {
        showError("Please upload a PDF, DOC, DOCX, or TXT file.");
        return;
      }

      if (file.size > MAX_FILE_BYTES) {
        showError("File size must be 5 MB or smaller.");
        return;
      }

      uploadedFile = file;
      fileNameDisplay.textContent = file.name;
      fileSizeDisplay.textContent = `(${formatFileSize(file.size)})`;
      filePill.classList.add("visible");
      dropzoneSubText.style.display = "none";
      dropzoneBox.classList.add("has-file");
      clearError();
    }

    function clearUploadedFile() {
      uploadedFile = null;
      resumeInput.value = "";
      filePill.classList.remove("visible");
      dropzoneSubText.style.display = "";
      dropzoneBox.classList.remove("has-file");
    }

    triggerAddRole.addEventListener("click", () => {
      const isOpen = rolePanel.classList.toggle("is-open");
      triggerAddRole.setAttribute("aria-expanded", String(isOpen));
      if (isOpen) {
        workRoleInput.focus();
      }
    });

    addWorkRoleBtn.addEventListener("click", addWorkRole);

    workRoleInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addWorkRole();
      }
    });

    workRoleChips.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-index]");
      if (!btn) return;
      workRoles.splice(Number(btn.dataset.index), 1);
      renderWorkRoles();
    });

    browseBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      resumeInput.click();
    });

    removeFileBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      clearUploadedFile();
    });

    dropzoneBox.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      resumeInput.click();
    });

    dropzoneBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        resumeInput.click();
      }
    });

    resumeInput.addEventListener("change", () => {
      if (resumeInput.files.length > 0) {
        setUploadedFile(resumeInput.files[0]);
      }
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropzoneBox.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzoneBox.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropzoneBox.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzoneBox.classList.remove("dragover");
      });
    });

    dropzoneBox.addEventListener("drop", (e) => {
      if (e.dataTransfer.files.length > 0) {
        setUploadedFile(e.dataTransfer.files[0]);
      }
    });

    workForm.addEventListener("submit", (e) => {
      e.preventDefault();

      if (!uploadedFile && workRoles.length === 0) {
        showError("Please add at least one role or upload your resume to continue.");
        return;
      }

      if (workRoles.length > 0) {
        localStorage.setItem("equiwork_work_roles", JSON.stringify(workRoles));
      }
      if (uploadedFile) {
        localStorage.setItem("equiwork_resume_uploaded", uploadedFile.name);
      }

      window.location.href = "employer_2.html";
    });
  </script>
</body>

</html>

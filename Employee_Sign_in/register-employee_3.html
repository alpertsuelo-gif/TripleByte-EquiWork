<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EquiWork | Expected Salary</title>

    <style>
      :root {
        --primary: #261fc4;
        --primary-dark: #15117a;
        --accent-gold: #ffd954;
        --accent-gold-hover: #f4c830;
        --accent-gold-ink: #b8860b;
        --heading-color: #1f2247;
        --text-main: #222638;
        --text-muted: #4b5068;
        --error-red: #b91c1c;
        --glass-bg: rgba(255, 255, 255, 0.86);
        --glass-border: rgba(255, 255, 255, 0.92);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 36px 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: transparent;
        color: var(--text-main);
        overflow-x: hidden;
      }

      /* BACKGROUND */
      .background-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: -1;
      }

      /* WRAPPER */
      .card-wrapper {
        position: relative;
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        animation: cardFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes cardFadeIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* GLASS CARD CONTAINER */
      .register-card {
        position: relative;
        width: 100%;
        padding: 38px 54px 40px;
        display: flex;
        flex-direction: column;
        background: var(--glass-bg);
        backdrop-filter: blur(36px) saturate(160%);
        -webkit-backdrop-filter: blur(36px) saturate(160%);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        box-shadow:
          0 24px 60px rgba(15, 20, 55, 0.22),
          0 4px 16px rgba(15, 20, 55, 0.1),
          inset 0 1px 1px rgba(255, 255, 255, 0.95);
      }

      /* TOP PROGRESS & LOGO ROW */
      .top-bar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      .progress-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .step-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .step-label strong {
        color: var(--heading-color);
        font-weight: 700;
      }

      .progress-pills {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pill {
        width: 76px;
        height: 11px;
        border-radius: 99px;
        background: rgba(180, 184, 197, 0.45);
        transition: background 0.25s ease;
      }

      .pill.is-active {
        background: var(--accent-gold);
        box-shadow: 0 2px 6px rgba(255, 217, 84, 0.45);
      }

      .logo-placeholder {
        width: 105px;
        height: 54px;
        object-fit: contain;
        flex-shrink: 0;
      }

      /* SALARY PICTURE */
      .icon-badge {
        margin-bottom: 18px;
      }

      .icon-badge img {
        width: 76px;
        height: 76px;
        object-fit: contain;
        display: block;
      }

      /* QUESTION HEADER */
      .question-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--heading-color);
        margin-bottom: 8px;
        line-height: 1.25;
      }

      .question-sub {
        font-size: 15px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 24px;
      }

      /* PILL SALARY INPUT */
      .salary-field-wrap {
        width: 100%;
        max-width: 440px;
        margin-bottom: 8px;
      }

      .salary-pill {
        display: flex;
        align-items: center;
        width: 100%;
        height: 48px;
        padding: 0 22px;
        border: 1.5px solid #1f2247;
        border-radius: 99px;
        background: #ffffff;
        transition: all 0.2s ease;
      }

      .salary-pill:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(38, 31, 196, 0.14);
      }

      .salary-pill.input-error {
        border-color: var(--error-red);
        box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
      }

      .currency-prefix {
        font-size: 16px;
        font-weight: 700;
        color: #111827;
        letter-spacing: 0.02em;
        user-select: none;
      }

      .currency-divider {
        width: 1.5px;
        height: 20px;
        background: #1f2247;
        margin: 0 16px;
        flex-shrink: 0;
      }

      .salary-input {
        flex: 1;
        width: 100%;
        border: none;
        background: transparent;
        font-size: 16.5px;
        font-weight: 500;
        color: #111827;
        outline: none;
      }

      .salary-input::placeholder {
        color: #9ba0b0;
      }

      /* Pay Period Quick Chips (Optional helper) */
      .period-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
        margin-bottom: 24px;
      }

      .period-btn {
        padding: 6px 14px;
        border-radius: 99px;
        border: 1px solid #cbd5e1;
        background: rgba(255, 255, 255, 0.75);
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .period-btn:hover {
        border-color: #94a3b8;
        background: #ffffff;
      }

      .period-btn.is-selected {
        background: #fef5d4;
        border-color: #f4c830;
        color: #5c4305;
      }

      .validation-hint {
        font-size: 12.5px;
        font-style: italic;
        font-weight: 500;
        color: var(--error-red);
        min-height: 18px;
        margin-top: 4px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease;
      }

      .validation-hint.visible {
        opacity: 1;
        visibility: visible;
      }

      /* FOOTER NAVIGATION (BACK & NEXT) */
      .nav-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 16px;
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: none;
        border: none;
        color: #d99b16;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.03em;
        cursor: pointer;
        text-decoration: none;
        padding: 8px 4px;
        transition:
          transform 0.2s ease,
          opacity 0.2s ease;
      }

      .btn-back:hover {
        transform: translateX(-3px);
        opacity: 0.85;
      }

      .btn-back svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2.5;
        fill: none;
      }

      .btn-next {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-width: 175px;
        height: 48px;
        padding: 0 26px;
        border: none;
        border-radius: 99px;
        background: var(--accent-gold);
        color: #111827;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.03em;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(244, 179, 35, 0.35);
        transition: all 0.2s ease;
      }

      .btn-next:hover {
        background: var(--accent-gold-hover);
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(244, 179, 35, 0.45);
      }

      .btn-next:active {
        transform: translateY(0);
      }

      .btn-next svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2.5;
        fill: none;
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .register-card {
          padding: 30px 24px 32px;
        }

        .top-bar {
          flex-direction: column-reverse;
          gap: 14px;
        }

        .pill {
          width: 64px;
        }

        .question-title {
          font-size: 22px;
        }

        .btn-next {
          min-width: 145px;
        }
      }
    </style>
  </head>

  <body>
    <!-- BACKGROUND HTML -->
    <iframe
      src="background-template.html"
      class="background-frame"
      title="EquiWork Background"
    ></iframe>

    <!-- WRAPPER -->
    <div class="card-wrapper">
      <main class="register-card">
        <!-- TOP STEP INDICATOR & LOGO -->
        <div class="top-bar">
          <div class="progress-section">
            <span class="step-label">Question <strong>3</strong> of 4</span>
            <div class="progress-pills" aria-label="Step 3 of 3">
              <span class="pill is-active"></span>
              <span class="pill is-active"></span>
              <span class="pill is-active"></span>
            </div>
          </div>

          <img
            src="EquiWork-Logo-removebg-preview.png"
            alt="EquiWork Logo"
            class="logo-placeholder"
          />
        </div>

        <!-- SALARY PICTURE -->
        <div class="icon-badge" aria-hidden="true">
          <img src="money_peso.webp" alt="Expected salary peso illustration" />
        </div>

        <!-- QUESTION PROMPT -->
        <h1 class="question-title">What’s your expected salary?</h1>
        <p class="question-sub">
          Add your expected salary to help us show you relevant jobs that match
          your expectations.
        </p>

        <!-- SALARY FORM -->
        <form id="salaryForm" novalidate>
          <div class="salary-field-wrap">
            <div class="salary-pill" id="salaryPill">
              <span class="currency-prefix">PHP</span>
              <span class="currency-divider" aria-hidden="true"></span>
              <input
                type="text"
                inputmode="decimal"
                id="salaryInput"
                class="salary-input"
                placeholder="500.00"
                autocomplete="off"
              />
            </div>
            <div class="validation-hint" id="salaryHint" role="alert">
              Please enter a valid expected salary amount.
            </div>
          </div>

          <!-- Pay Frequency Toggle -->
          <div class="period-row" role="group" aria-label="Pay frequency">
            <button
              type="button"
              class="period-btn is-selected"
              data-period="Per Day"
            >
              Per Day
            </button>
            <button type="button" class="period-btn" data-period="Per Week">
              Per Week
            </button>
            <button type="button" class="period-btn" data-period="Per Month">
              Per Month
            </button>
          </div>

          <!-- BOTTOM NAVIGATION -->
          <div class="nav-footer">
            <a href="register-employee_2.html" class="btn-back">
              <svg
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span>BACK</span>
            </a>

            <button type="submit" class="btn-next">
              <span>NEXT</span>
              <svg
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </form>
      </main>
    </div>

    <script>
      const salaryForm = document.getElementById("salaryForm");
      const salaryPill = document.getElementById("salaryPill");
      const salaryInput = document.getElementById("salaryInput");
      const salaryHint = document.getElementById("salaryHint");
      const periodButtons = document.querySelectorAll(".period-btn");

      let selectedPeriod =
        localStorage.getItem("equiwork_salary_period") || "Per Day";

      // Restore saved salary if returning to this step
      const savedSalary = localStorage.getItem("equiwork_expected_salary");
      if (savedSalary) {
        salaryInput.value = savedSalary;
      }

      periodButtons.forEach((btn) => {
        btn.classList.toggle(
          "is-selected",
          btn.dataset.period === selectedPeriod,
        );
        btn.addEventListener("click", () => {
          periodButtons.forEach((b) => b.classList.remove("is-selected"));
          btn.classList.add("is-selected");
          selectedPeriod = btn.dataset.period;
        });
      });

      function showError(msg) {
        salaryHint.textContent = msg;
        salaryHint.classList.add("visible");
        salaryPill.classList.add("input-error");
      }

      function clearError() {
        salaryHint.classList.remove("visible");
        salaryPill.classList.remove("input-error");
      }

      // Allow only numbers, commas, and a single decimal point
      salaryInput.addEventListener("input", () => {
        salaryInput.value = salaryInput.value.replace(/[^0-9.,]/g, "");
        if (salaryInput.value.trim().length > 0) clearError();
      });

      // Format to two decimal places on blur (e.g., 500 -> 500.00)
      salaryInput.addEventListener("blur", () => {
        const raw = salaryInput.value.replace(/,/g, "").trim();
        if (!raw) return;
        const num = parseFloat(raw);
        if (!isNaN(num) && num > 0) {
          salaryInput.value = num.toLocaleString("en-PH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
        }
      });

      salaryForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const raw = salaryInput.value.replace(/,/g, "").trim();
        const amount = parseFloat(raw);

        if (!raw || isNaN(amount) || amount <= 0) {
          showError("Please enter a valid expected salary greater than 0.");
          salaryInput.focus();
          return;
        }

        localStorage.setItem("equiwork_expected_salary", salaryInput.value);
        localStorage.setItem("equiwork_salary_period", selectedPeriod);

        // Proceed to Question 4
        window.location.href = "register-employee_4.html";
      });
    </script>
  </body>
</html>

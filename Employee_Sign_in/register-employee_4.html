<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EquiWork | Enter Your Personal Details</title>

  <style>
    :root {
      --primary: #261fc4;
      --primary-dark: #15117a;
      --accent-gold: #ffd954;
      --accent-gold-hover: #f4c830;
      --accent-gold-ink: #b8860b;
      --heading-color: #1f2247;
      --text-main: #222638;
      --text-muted: #4b5068;
      --error-red: #b91c1c;
      --glass-bg: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.92);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 16px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      background: transparent;
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* BACKGROUND */
    .background-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: -1;
    }

    /* WRAPPER */
    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      animation: cardFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* GLASS CARD CONTAINER */
    .register-card {
      position: relative;
      width: 100%;
      padding: 40px 54px 40px;
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      backdrop-filter: blur(36px) saturate(160%);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow:
        0 24px 60px rgba(15, 20, 55, 0.22),
        0 4px 16px rgba(15, 20, 55, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    /* FOCUS ACCESSIBILITY */
    button:focus-visible,
    a:focus-visible {
      outline: 2.5px solid var(--primary);
      outline-offset: 2px;
    }

    /* STEP PROGRESS ROW */
    .progress-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-label {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .step-label strong {
      color: var(--heading-color);
      font-weight: 700;
    }

    .progress-pills {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      width: 64px;
      height: 11px;
      border-radius: 99px;
      background: rgba(180, 184, 197, 0.45);
    }

    .pill.is-active {
      background: var(--accent-gold);
      box-shadow: 0 2px 6px rgba(255, 217, 84, 0.45);
    }

    /* TOP HEADER ROW */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .header-copy {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .question-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--heading-color);
      line-height: 1.2;
    }

    .question-sub {
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .illustration-placeholder {
      width: 90px;
      height: 90px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    /* FORM & INPUTS */
    .details-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: #9ba0b0;
    }

    .form-input:hover {
      background: #ffffff;
      border-color: #94a3b8;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(38, 31, 196, 0.14);
    }

    .form-input.input-error {
      border-color: var(--error-red);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1);
    }

    /* Location input with pin icon */
    .location-wrap {
      position: relative;
    }

    .location-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #f4b323;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .location-icon svg {
      width: 20px;
      height: 20px;
    }

    .location-input {
      padding-left: 42px;
    }

    .validation-hint {
      font-size: 12.5px;
      font-style: italic;
      font-weight: 500;
      color: var(--error-red);
      min-height: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, max-height 0.2s ease;
    }

    .validation-hint.visible {
      min-height: 18px;
      max-height: 28px;
      opacity: 1;
    }

    /* VISIBILITY OPTIONS SECTION */
    .visibility-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--heading-color);
      margin-top: 4px;
      margin-bottom: -4px;
    }

    .visibility-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .visibility-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.72);
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .visibility-card:hover {
      background: #ffffff;
      border-color: #94a3b8;
    }

    .visibility-card:focus-within {
      outline: 2.5px solid var(--primary);
      outline-offset: 2px;
    }

    .visibility-card.is-selected {
      background: #fef5d4;
      border-color: #f4c830;
      box-shadow: 0 4px 12px rgba(244, 200, 48, 0.18);
    }

    .visibility-radio {
      margin-top: 2px;
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .visibility-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .visibility-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--heading-color);
    }

    .visibility-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* FOOTER NAVIGATION (BACK & NEXT) */
    .nav-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: #d99b16;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-decoration: none;
      padding: 8px 4px;
      border-radius: 8px;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .btn-back:hover {
      transform: translateX(-3px);
      opacity: 0.85;
    }

    .btn-back svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    .btn-next {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 175px;
      height: 48px;
      padding: 0 26px;
      border: none;
      border-radius: 99px;
      background: var(--accent-gold);
      color: #111827;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(244, 179, 35, 0.35);
      transition: all 0.2s ease;
    }

    .btn-next:hover {
      background: var(--accent-gold-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(244, 179, 35, 0.45);
    }

    .btn-next:active {
      transform: translateY(0);
    }

    .btn-next svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .register-card {
        padding: 30px 24px 32px;
      }

      .top-bar {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 12px;
      }

      .pill {
        width: 52px;
      }

      .name-row {
        grid-template-columns: 1fr;
      }

      .question-title {
        font-size: 24px;
      }

      .btn-next {
        min-width: 145px;
      }
    }
  </style>
</head>

<body>
  <!-- BACKGROUND HTML -->
  <iframe src="background-template.html" class="background-frame" title="EquiWork Background"></iframe>

  <!-- WRAPPER -->
  <div class="card-wrapper">
    <main class="register-card">
      <!-- STEP PROGRESS -->
      <div class="progress-bar-row">
        <div class="progress-section">
          <span class="step-label">Question <strong>4</strong> of 4</span>
          <div class="progress-pills" aria-label="Step 4 of 4">
            <span class="pill is-active"></span>
            <span class="pill is-active"></span>
            <span class="pill is-active"></span>
            <span class="pill is-active"></span>
          </div>
        </div>
      </div>

      <!-- TOP HEADER & ILLUSTRATION -->
      <div class="top-bar">
        <div class="header-copy">
          <h1 class="question-title">Enter your personal details</h1>
          <p class="question-sub">
            Tell us who you are and choose how employers can discover your profile.
          </p>
        </div>
        <img src="icon-details-removebg-preview.png" alt="Personal details resume icon"
          class="illustration-placeholder" />
      </div>

      <!-- DETAILS FORM -->
      <form id="detailsForm" class="details-form" novalidate>
        <div class="name-row">
          <div class="input-group">
            <input type="text" id="firstNameInput" class="form-input" placeholder="First Name"
              aria-label="First Name" autocomplete="given-name" required />
          </div>
          <div class="input-group">
            <input type="text" id="lastNameInput" class="form-input" placeholder="Last Name"
              aria-label="Last Name" autocomplete="family-name" required />
          </div>
        </div>

        <div class="input-group location-wrap">
          <span class="location-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
            </svg>
          </span>
          <input type="text" id="locationInput" class="form-input location-input" placeholder="City or Province"
            aria-label="Location" autocomplete="address-level2" required />
        </div>

        <div class="validation-hint" id="detailsHint" role="alert">
          Please fill in all required personal details.
        </div>

        <!-- PROFILE VISIBILITY RADIOS -->
        <span class="visibility-heading" id="visibilityHeading">Profile visibility</span>
        <div class="visibility-section" role="radiogroup" aria-labelledby="visibilityHeading">
          <label class="visibility-card is-selected" id="cardPublic">
            <input type="radio" name="visibility" value="Public" class="visibility-radio" checked />
            <div class="visibility-content">
              <span class="visibility-title">Public</span>
              <span class="visibility-desc">
                Searchable by all employers. Unlocks full profile details,
                resume access, and direct messaging.
              </span>
            </div>
          </label>

          <label class="visibility-card" id="cardStandard">
            <input type="radio" name="visibility" value="Standard Access" class="visibility-radio" />
            <div class="visibility-content">
              <span class="visibility-title">Standard Access</span>
              <span class="visibility-desc">
                Employers can find you in search, download your resume, and
                contact you.
              </span>
            </div>
          </label>

          <label class="visibility-card" id="cardHidden">
            <input type="radio" name="visibility" value="Hidden" class="visibility-radio" />
            <div class="visibility-content">
              <span class="visibility-title">Hidden</span>
              <span class="visibility-desc">
                Your profile is private. Employers only see your details when
                you submit a job application.
              </span>
            </div>
          </label>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="nav-footer">
          <a href="register-employee_3.html" class="btn-back">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>BACK</span>
          </a>

          <button type="submit" class="btn-next">
            <span>NEXT</span>
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const detailsForm = document.getElementById("detailsForm");
    const firstNameInput = document.getElementById("firstNameInput");
    const lastNameInput = document.getElementById("lastNameInput");
    const locationInput = document.getElementById("locationInput");
    const detailsHint = document.getElementById("detailsHint");
    const visibilityCards = document.querySelectorAll(".visibility-card");
    const visibilityRadios = document.querySelectorAll(
      "input[name='visibility']",
    );

    function syncVisibilityCards() {
      visibilityCards.forEach((card) => card.classList.remove("is-selected"));
      const checked = document.querySelector("input[name='visibility']:checked");
      if (checked) {
        checked.closest(".visibility-card").classList.add("is-selected");
      }
    }

    // Restore saved personal details when returning to this step
    const savedFirstName = localStorage.getItem("equiwork_first_name");
    const savedLastName = localStorage.getItem("equiwork_last_name");
    const savedLocation = localStorage.getItem("equiwork_profile_location");
    const savedVisibility = localStorage.getItem("equiwork_profile_visibility");

    if (savedFirstName) firstNameInput.value = savedFirstName;
    if (savedLastName) lastNameInput.value = savedLastName;
    if (savedLocation) {
      locationInput.value = savedLocation;
    } else {
      try {
        const preferredLocs = JSON.parse(localStorage.getItem("equiwork_user_locations") || "[]");
        if (Array.isArray(preferredLocs) && preferredLocs.length > 0) {
          locationInput.value = preferredLocs[0];
        }
      } catch {
        // Ignore malformed localStorage data
      }
    }

    if (savedVisibility) {
      visibilityRadios.forEach((radio) => {
        radio.checked = radio.value === savedVisibility;
      });
    }
    syncVisibilityCards();

    visibilityRadios.forEach((radio) => {
      radio.addEventListener("change", syncVisibilityCards);
    });

    function showError(msg) {
      detailsHint.textContent = msg;
      detailsHint.classList.add("visible");
    }

    function clearError() {
      detailsHint.classList.remove("visible");
    }

    [firstNameInput, lastNameInput, locationInput].forEach((input) => {
      input.addEventListener("input", () => {
        input.classList.remove("input-error");
        clearError();
      });
    });

    detailsForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const firstName = firstNameInput.value.trim();
      const lastName = lastNameInput.value.trim();
      const location = locationInput.value.trim();
      const selectedVisibility = document.querySelector(
        "input[name='visibility']:checked",
      ).value;

      if (!firstName) {
        firstNameInput.classList.add("input-error");
        firstNameInput.focus();
        showError("Please enter your first name.");
        return;
      }
      if (!lastName) {
        lastNameInput.classList.add("input-error");
        lastNameInput.focus();
        showError("Please enter your last name.");
        return;
      }
      if (!location) {
        locationInput.classList.add("input-error");
        locationInput.focus();
        showError("Please enter your location.");
        return;
      }

      localStorage.setItem("equiwork_first_name", firstName);
      localStorage.setItem("equiwork_last_name", lastName);
      localStorage.setItem("equiwork_profile_location", location);
      localStorage.setItem("equiwork_profile_visibility", selectedVisibility);

      window.location.href = "register-employee_5.html";
    });
  </script>
</body>

</html>
